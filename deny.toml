[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0459", reason = "SQLite WAL page-size flaw needs a crafted database and -wal file placed in the data directory by an attacker; the database is created and opened only by this app. sqlx 0.9.0 pins the affected libsqlite3-sys. Remove once sqlx allows >= 0.39." },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
