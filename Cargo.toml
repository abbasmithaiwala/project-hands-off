[workspace]
resolver = "3"
members = ["crates/api", "crates/core", "crates/vision", "crates/llm", "crates/imaging"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
repository = "https://github.com/hands-off/hands-off"

[workspace.dependencies]
hands-off-core = { path = "crates/core" }
hands-off-imaging = { path = "crates/imaging" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
utoipa = { version = "6.0.0", features = ["uuid", "chrono"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
async-trait = "0.1.92"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
