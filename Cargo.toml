[workspace]
resolver = "3"
members = ["crates/api", "crates/core", "crates/vision", "crates/llm", "crates/imaging"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
repository = "https://github.com/hands-off/hands-off"

[workspace.dependencies]
hands-off-core = { path = "crates/core" }
hands-off-imaging = { path = "crates/imaging" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0"
uuid = { version = "1.29.2", features = ["v4", "serde"] }
utoipa = { version = "6.0.0", features = ["uuid", "chrono"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
async-trait = "0.1.92"
sha2 = "0.11.1"
hex = "0.4.3"
futures = "0.3.34"
tracing = "0.1.44"
tempfile = "3.27.0"
tokio = "1.54.1"
axum = "0.8.9"
image = { version = "0.25.10", default-features = false }
schemars = { version = "1.2.3", features = ["uuid1", "chrono04"] }
secrecy = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
module_name_repetitions = "allow"

# LTO is off because thin LTO drops `___isPlatformVersionAtLeast` from compiler_builtins,
# which ONNX Runtime's prebuilt macOS libraries need, breaking the release link.
[profile.release]
lto = "off"
codegen-units = 1
strip = true
