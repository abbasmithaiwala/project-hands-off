[package]
name = "hands-off-vision"
description = "Local object detection and segmentation behind swappable traits."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
futures.workspace = true
hands-off-core = { version = "0.1.0", path = "../core" }
hands-off-imaging = { version = "0.1.0", path = "../imaging" }
hex.workspace = true
image.workspace = true
ort = "2.0.0-rc.15"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt", "macros"] }
tracing.workspace = true

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
tempfile.workspace = true
