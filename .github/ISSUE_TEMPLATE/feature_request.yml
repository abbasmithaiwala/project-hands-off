name: Feature request
description: An idea that would make Hands-Off better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem or the workflow, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like to happen
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
