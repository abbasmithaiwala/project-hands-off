name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Upload a photo\n2. Click the couch\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, image tag or commit.
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How you run it
      options: [Docker, Release binary, From source]
    validations:
      required: true
  - type: input
    id: models
    attributes:
      label: Models in use
      description: Shown in Settings. Say if you changed any.
  - type: textarea
    id: logs
    attributes:
      label: Activity panel and server log
      description: The "Activity" panel in the app and the server log around the problem. Remove anything private.
      render: text
